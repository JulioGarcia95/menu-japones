<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Extras — Matilda Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>
    <nav class="site-nav" aria-label="Secciones">
      <a class="site-nav-btn is-active" href="/">Menú</a>
      <a class="site-nav-btn" href="/historial.html">Historial</a>
    </nav>

    <header class="category-hero">
      <a class="back-link" href="/">← Todas las categorías</a>
      <h1>Extras</h1>
      <p>Complementos para tu mesa.</p>
    </header>

    <main>
      <section class="menu-section menu-section-solo">
        <ul class="menu-list">
          <li class="menu-item">
            <div class="item-copy">
              <h3>Salsa extra</h3>
              <p>Porción adicional de salsa de soya o spicy mayo.</p>
            </div>
            <div class="item-actions">
              <p class="price">$5</p>
              <button type="button" class="btn-add" data-id="salsa-extra" data-name="Salsa extra" data-price="5">Agregar</button>
            </div>
          </li>
          <li class="menu-item">
            <div class="item-copy">
              <h3>Palillos</h3>
              <p>Par extra de palillos desechables.</p>
            </div>
            <div class="item-actions">
              <p class="price">$5</p>
              <button type="button" class="btn-add" data-id="palillos" data-name="Palillos" data-price="5">Agregar</button>
            </div>
          </li>
        </ul>
      </section>
    </main>

    <footer class="footer"><p>Matilda Kitchen · Extras</p></footer>
    <div id="cart-root"></div>
    <script src="/cart-ui.js"></script>
    <script src="/cart.js"></script>
  </body>
</html>
