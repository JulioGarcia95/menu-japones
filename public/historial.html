<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Historial — Matilda Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <nav class="site-nav" aria-label="Secciones">
      <a class="site-nav-btn" href="/">Menú</a>
      <a class="site-nav-btn is-active" href="/historial.html">Historial</a>
      <a class="site-nav-btn" href="/pagar.html">Pagar cuenta</a>
    </nav>

    <section class="historial-page">
      <div class="section-head">
        <h2>Historial de pedidos</h2>
        <p>Pedidos de tu mesa. Cada fila es un pedido y abajo la suma total.</p>
      </div>
      <p class="mesa-fija pagar-mesa" id="historial-mesa">Mesa01</p>
      <p class="historial-status" id="historial-status">Cargando…</p>
      <div class="historial-sheet" id="historial-sheet" hidden>
        <div class="historial-table-wrap">
          <table class="historial-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Mesa</th>
                <th>Hora</th>
                <th>Pedido</th>
                <th>Estado</th>
                <th class="col-num">Total</th>
              </tr>
            </thead>
            <tbody id="historial-body"></tbody>
            <tfoot>
              <tr>
                <td colspan="5" class="historial-sum-label">Suma final</td>
                <td class="col-num" id="historial-sum">$0</td>
              </tr>
            </tfoot>
          </table>
        </div>
        <p class="historial-meta" id="historial-meta"></p>
      </div>
    </section>

    <div id="cart-root"></div>
    <script src="/mesa.js"></script>
    <script src="/cart-ui.js"></script>
    <script src="/cart.js"></script>
    <script src="/historial.js"></script>
  </body>
</html>
